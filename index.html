<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3d2b">
<title>مهامي اليومية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
/* تخطيط: عمود واحد للجوال، شريط اليوم أعلاه، زر المايك العائم أسفل */
:root{
  --bg:#f3f1ea; --card:#ffffff; --fg:#1d2420; --muted:#6b7369; --line:#e1ddd1;
  --accent:#1f5a3a; --accent-2:#b5832b; --danger:#b23a2e; --rec:#d4372a;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121613; --card:#1b211d; --fg:#e8ebe6; --muted:#97a196; --line:#2a322c;
  --accent:#5fb487; --accent-2:#d8a54a; --danger:#e0695c; --rec:#ef5a4c; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
.row>div{min-width:0}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;display:block;text-align:right}
.check input{-webkit-appearance:auto;appearance:auto;accent-color:var(--accent)}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.close{border:none;background:var(--bg);color:var(--fg);width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);align-self:center;margin:-8px 0 -4px}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0)) calc(120px + env(safe-area-inset-bottom,0)) max(16px,env(safe-area-inset-left,0))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:1.7rem;margin:0;color:var(--accent);line-height:1.2}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.icon-btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

.day{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.day .label{text-align:center;flex:1}
.day .label b{display:block;font-size:1.05rem}
.day .label small{color:var(--muted);font-size:.85rem}
.nav{width:40px;height:40px;border-radius:10px;border:none;background:transparent;color:var(--fg);font-size:1.3rem;cursor:pointer}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:-8px}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 14px;font:inherit;font-size:.88rem;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.list{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.task .chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);background:transparent;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:.9rem;margin-top:2px}
.task.done .chk{background:var(--accent)}
.task .body{flex:1;min-width:0}
.task .text{word-wrap:break-word;white-space:pre-wrap}
.task.done .text{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:.78rem;color:var(--muted)}
.tag{border-radius:6px;padding:1px 8px;background:var(--bg);border:1px solid var(--line)}
.tag.time{color:var(--accent-2);border-color:currentColor;font-variant-numeric:tabular-nums}
.task .del{flex:none;border:none;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:1px dashed var(--line);border-radius:14px}

/* شاشة الإضافة */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-in{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;
  padding:20px max(16px,env(safe-area-inset-right,0)) calc(20px + env(safe-area-inset-bottom,0)) max(16px,env(safe-area-inset-left,0));
  display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.sheet h2{margin:0;font-family:var(--display);font-size:1.3rem}
.mic-big{align-self:center;width:96px;height:96px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;position:relative}
.mic-big svg{width:40px;height:40px}
.mic-big.rec{background:var(--rec)}
.mic-big.rec::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--rec);animation:pulse 1.2s infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.mic-big.rec::after{animation:none}}
.hint{text-align:center;color:var(--muted);font-size:.88rem;margin:-6px 0 0}
textarea,input,select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row label,.field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.check{display:flex;align-items:center;gap:8px;font-size:.95rem}
.check input{width:20px;height:20px}
.actions{display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:12px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0));
  width:72px;height:72px;border-radius:50%;border:none;background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer;display:grid;place-items:center;z-index:10}
.fab svg{width:32px;height:32px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.9rem;z-index:30}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>مهامي اليومية</h1>
    <button class="icon-btn" id="notifBtn">🔔 تفعيل التنبيهات</button>
  </header>

  <div class="day">
    <button class="nav" id="next" aria-label="اليوم التالي">›</button>
    <div class="label"><b id="dayName"></b><small id="dayDate"></small></div>
    <button class="nav" id="prev" aria-label="اليوم السابق">‹</button>
  </div>
  <div class="progress"><span id="bar"></span></div>
  <div class="stats"><span id="statDone"></span><button class="chip" id="todayBtn" style="padding:2px 12px">اليوم</button></div>

  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>
</div>

<button class="fab" id="fab" aria-label="إضافة مهمة بالصوت">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
</button>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div class="grab"></div>
    <div class="sheet-head"><h2 id="sheetTitle">مهمة جديدة</h2><button class="close" id="closeX" aria-label="إغلاق">✕</button></div>
    <button class="mic-big" id="mic" aria-label="ابدأ التسجيل">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <p class="hint" id="hint">اضغط المايك وتكلم… الكلام يتحول لنص تلقائياً</p>
    <div class="field"><label for="txt">نص المهمة</label><textarea id="txt" placeholder="مثال: أتابع مع العامل سقي الخط رقم ٣"></textarea></div>
    <div class="row">
      <div><label for="cat">القسم</label><select id="cat"></select></div>
      <div><label for="time">وقت التذكير (اختياري)</label><input type="time" id="time"></div>
    </div>
    <div class="row">
      <div><label for="date">التاريخ</label><input type="date" id="date"></div>
      <div style="display:flex;align-items:flex-end"><label class="check" for="daily"><input type="checkbox" id="daily"> تتكرر كل يوم</label></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="save">حفظ</button>
      <button class="btn ghost" id="cancel">إلغاء</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const CATS=["عام","المزرعة","البناية","الهجن","الغنم","المتجر","شخصي"];
const KEY="daily-tasks-v1";
let tasks=[]; try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
let cur=todayStr(), filter="الكل", editId=null;
const $=id=>document.getElementById(id);

function todayStr(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}
function forDay(d){return tasks.filter(t=>t.daily?t.date<=d:t.date===d)}
function isDone(t,d){return t.daily?(t.doneDates||[]).includes(d):!!t.done}
function fmt12(t){if(!t)return"";let[h,m]=t.split(":").map(Number);const p=h<12?"ص":"م";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+p}

function render(){
  const d=new Date(cur+"T00:00");
  $("dayName").textContent=(cur===todayStr()?"اليوم · ":"")+d.toLocaleDateString("ar-AE",{weekday:"long"});
  $("dayDate").textContent=d.toLocaleDateString("ar-AE",{day:"numeric",month:"long",year:"numeric"});
  $("todayBtn").hidden=cur===todayStr();
  const all=forDay(cur);
  const done=all.filter(t=>isDone(t,cur)).length;
  $("bar").style.width=all.length?(done/all.length*100)+"%":"0";
  $("statDone").textContent=all.length?`أنجزت ${done} من ${all.length}`:"لا توجد مهام";

  const used=["الكل",...CATS.filter(c=>all.some(t=>t.cat===c))];
  if(!used.includes(filter))filter="الكل";
  $("filters").innerHTML="";
  used.forEach(c=>{const b=document.createElement("button");b.className="chip"+(c===filter?" on":"");b.textContent=c;b.onclick=()=>{filter=c;render()};$("filters").appendChild(b)});

  let list=all.filter(t=>filter==="الكل"||t.cat===filter);
  list.sort((a,b)=>(isDone(a,cur)-isDone(b,cur))||((a.time||"99")>(b.time||"99")?1:-1));
  const L=$("list");L.innerHTML="";
  if(!list.length){L.innerHTML='<div class="empty">ما في مهام لهذا اليوم.<br>اضغط المايك تحت وسجّل أول مهمة بصوتك.</div>';return}
  list.forEach(t=>{
    const el=document.createElement("div");el.className="task"+(isDone(t,cur)?" done":"");
    el.innerHTML=`<button class="chk" aria-label="إنجاز">${isDone(t,cur)?"✓":""}</button>
      <div class="body"><div class="text"></div><div class="meta">
      <span class="tag">${t.cat}</span>${t.time?`<span class="tag time">⏰ ${fmt12(t.time)}</span>`:""}${t.daily?'<span class="tag">يومي</span>':""}</div></div>
      <button class="del" aria-label="حذف">✕</button>`;
    el.querySelector(".text").textContent=t.text;
    el.querySelector(".text").onclick=()=>openSheet(t);
    el.querySelector(".chk").onclick=()=>{toggle(t)};
    el.querySelector(".del").onclick=()=>{if(el.dataset.c){tasks=tasks.filter(x=>x.id!==t.id);save();render()}else{el.dataset.c=1;el.querySelector(".del").textContent="حذف؟";setTimeout(()=>{if(el.isConnected){delete el.dataset.c;el.querySelector(".del").textContent="✕"}},2500)}};
    L.appendChild(el);
  });
}
function toggle(t){
  if(t.daily){t.doneDates=t.doneDates||[];const i=t.doneDates.indexOf(cur);i>=0?t.doneDates.splice(i,1):t.doneDates.push(cur)}
  else t.done=!t.done;
  save();render();
}

// ورقة الإضافة
$("cat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
function openSheet(t){
  editId=t?t.id:null;
  $("sheetTitle").textContent=t?"تعديل المهمة":"مهمة جديدة";
  $("txt").value=t?t.text:"";$("cat").value=t?t.cat:(filter!=="الكل"?filter:"عام");
  $("time").value=t?t.time||"":"";$("date").value=t?t.date:cur;$("daily").checked=t?!!t.daily:false;
  $("sheet").hidden=false;
}
function closeSheet(){stopRec();$("sheet").hidden=true}
$("fab").onclick=()=>{openSheet();startRec()};
$("cancel").onclick=closeSheet;
$("closeX").onclick=closeSheet;
// سحب الصفحة للأسفل لإغلاقها
(function(){const s=document.querySelector(".sheet-in");let y0=null,dy=0;
s.addEventListener("touchstart",e=>{if(s.scrollTop<=0&&!e.target.closest("textarea,input,select"))y0=e.touches[0].clientY;else y0=null},{passive:true});
s.addEventListener("touchmove",e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);s.style.transform=`translateY(${dy}px)`},{passive:true});
s.addEventListener("touchend",()=>{if(y0===null)return;s.style.transform="";if(dy>100)closeSheet();y0=null;dy=0});})();
$("sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};
$("save").onclick=()=>{
  const text=$("txt").value.trim(); if(!text){toast("اكتب أو سجّل نص المهمة أولاً");return}
  const data={text,cat:$("cat").value,time:$("time").value,date:$("date").value||cur,daily:$("daily").checked};
  if(editId){Object.assign(tasks.find(x=>x.id===editId),data)}
  else tasks.push({id:Date.now().toString(36),done:false,doneDates:[],notified:{},...data});
  save();closeSheet();cur=data.daily?cur:data.date;render();toast("تم الحفظ");
};

// التعرف على الصوت
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, recOn=false, base="";
function startRec(){
  if(!SR){$("hint").textContent="المتصفح لا يدعم تحويل الصوت. استخدم Chrome أو Safari، أو اكتب المهمة.";return}
  if(recOn)return;
  rec=new SR(); rec.lang="ar-AE"; rec.interimResults=true; rec.continuous=true;
  base=$("txt").value?$("txt").value+" ":"";
  rec.onresult=e=>{let fin="",tmp="";for(let i=0;i<e.results.length;i++){const r=e.results[i];(r.isFinal?(fin+=r[0].transcript+" "):(tmp+=r[0].transcript))}$("txt").value=(base+fin+tmp).trim()};
  rec.onerror=e=>{$("hint").textContent=e.error==="not-allowed"?"اسمح للمتصفح باستخدام المايك من الإعدادات":"صار خطأ في التسجيل، جرّب مرة ثانية"};
  rec.onend=()=>{recOn=false;$("mic").classList.remove("rec");if($("hint").textContent.startsWith("أسمعك"))$("hint").textContent="انتهى التسجيل. عدّل النص إذا تبي ثم اضغط حفظ"};
  try{rec.start();recOn=true;$("mic").classList.add("rec");$("hint").textContent="أسمعك… اضغط المايك مرة ثانية للإيقاف"}catch(e){}
}
function stopRec(){if(rec&&recOn){rec.stop()}}
$("mic").onclick=()=>recOn?stopRec():startRec();

// التنقل بين الأيام
function shift(n){const d=new Date(cur+"T00:00");d.setDate(d.getDate()+n);cur=todayStr(d);render()}
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);$("todayBtn").onclick=()=>{cur=todayStr();render()};

// التنبيهات (تعمل والموقع مفتوح)
function updNotifBtn(){const b=$("notifBtn");if(!("Notification"in window)){b.hidden=true;return}b.hidden=Notification.permission==="granted"}
$("notifBtn").onclick=async()=>{try{const p=await Notification.requestPermission();toast(p==="granted"?"تم تفعيل التنبيهات":"لم يتم السماح بالتنبيهات")}catch(e){}updNotifBtn()};
function checkAlarms(){
  const now=new Date(),d=todayStr(now),hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  let ch=false;
  forDay(d).forEach(t=>{
    if(!t.time||isDone(t,d))return;t.notified=t.notified||{};
    if(t.time<=hm&&!t.notified[d]){t.notified[d]=1;ch=true;
      if("Notification"in window&&Notification.permission==="granted"){try{new Notification("⏰ "+t.cat,{body:t.text})}catch(e){}}
      toast("⏰ "+t.text);if(navigator.vibrate)navigator.vibrate([200,100,200]);}
  });
  if(ch)save();
}
// لا ننبه على مهام فات وقتها قبل فتح الموقع
(function(){const now=new Date(),d=todayStr(now),hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");forDay(d).forEach(t=>{if(t.time&&t.time<hm){t.notified=t.notified||{};t.notified[d]=1}});save()})();
setInterval(checkAlarms,20000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(cur!==todayStr()&&!render.moved){}render();checkAlarms()}});

updNotifBtn();render();
</script>
</body>
</html>
